<!-- 공통 컴포넌트 마크업 템플릿 -->

<template id="button-primary">
  <button class="btn btn-primary btn-md">버튼</button>
</template>

<template id="button-secondary">
  <button class="btn btn-secondary btn-md">버튼</button>
</template>

<template id="button-danger">
  <button class="btn btn-danger btn-md">버튼</button>
</template>

<template id="button-text">
  <button class="btn btn-text btn-md">버튼</button>
</template>

<template id="input-text">
  <input type="text" class="input-field" placeholder="입력">
</template>

<template id="input-password">
  <input type="password" class="input-field" placeholder="비밀번호">
</template>

<template id="input-email">
  <input type="email" class="input-field" placeholder="이메일">
</template>

<template id="form-group">
  <div class="form-group">
    <label class="form-label">라벨</label>
    <input type="text" class="input-field" placeholder="입력">
  </div>
</template>

<template id="badge-success">
  <span class="badge badge-success">성공</span>
</template>

<template id="badge-error">
  <span class="badge badge-error">오류</span>
</template>

<template id="badge-warning">
  <span class="badge badge-warning">경고</span>
</template>

<template id="spinner">
  <div class="spinner">
    <div class="spinner-inner"></div>
  </div>
</template>

<template id="divider">
  <div class="divider"></div>
</template>

<template id="card">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">제목</h3>
    </div>
    <div class="card-content">
      <p>내용</p>
    </div>
  </div>
</template>

<template id="list-item">
  <li class="list-item">
    <span class="list-item-label">항목</span>
    <button class="list-item-action">작업</button>
  </li>
</template>

<template id="message-user">
  <div class="message message-user">
    <div class="message-content">
      <p>메시지 내용</p>
    </div>
    <span class="message-time">시간</span>
  </div>
</template>

<template id="message-bot">
  <div class="message message-bot">
    <div class="message-content">
      <p>메시지 내용</p>
    </div>
    <span class="message-time">시간</span>
  </div>
</template>

<template id="table-simple">
  <table class="table">
    <thead>
      <tr>
        <th>컬럼 1</th>
        <th>컬럼 2</th>
        <th>컬럼 3</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>데이터 1</td>
        <td>데이터 2</td>
        <td>데이터 3</td>
      </tr>
    </tbody>
  </table>
</template>

<template id="tab-container">
  <div class="tab-container">
    <div class="tab-headers">
      <button class="tab-header active">탭 1</button>
      <button class="tab-header">탭 2</button>
    </div>
    <div class="tab-contents">
      <div class="tab-content active">
        <p>탭 1 내용</p>
      </div>
      <div class="tab-content">
        <p>탭 2 내용</p>
      </div>
    </div>
  </div>
</template>

<template id="modal-default">
  <div class="modal-overlay active">
    <div class="modal modal-md show">
      <div class="modal-header">
        <h3 class="modal-title">모달 제목</h3>
        <button class="modal-close">x</button>
      </div>
      <div class="modal-content">
        <p>모달 내용</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary">취소</button>
        <button class="btn btn-primary">확인</button>
      </div>
    </div>
  </div>
</template>

<template id="toast-success">
  <div class="toast toast-success show">
    <span class="toast-icon">✓</span>
    <span class="toast-message">성공 메시지</span>
    <button class="toast-close">x</button>
  </div>
</template>

<template id="toast-error">
  <div class="toast toast-error show">
    <span class="toast-icon">x</span>
    <span class="toast-message">오류 메시지</span>
    <button class="toast-close">x</button>
  </div>
</template>
