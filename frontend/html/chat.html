            <path d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.05.05a2 2 0 0 1-2.83 2.83l-.05-.05A1.8 1.8 0 0 0 15 19.45a1.8 1.8 0 0 0-1.09 1.65V21a2 2 0 0 1-4 0v-.08A1.8 1.8 0 0 0 8.85 19.3a1.8 1.8 0 0 0-1.98.36l-.05.05a2 2 0 1 1-2.83-2.83l.05-.05A1.8 1.8 0 0 0 4.4 15a1.8 1.8 0 0 0-1.65-1.09H2.7a2 2 0 0 1 0-4h.08A1.8 1.8 0 0 0 4.4 8.85a1.8 1.8 0 0 0-.36-1.98L4 6.82A2 2 0 1 1 6.82 4l.05.05a1.8 1.8 0 0 0 1.98.36A1.8 1.8 0 0 0 9.94 2.8V2.7a2 2 0 0 1 4 0v.08a1.8 1.8 0 0 0 1.09 1.65 1.8 1.8 0 0 0 1.98-.36l.05-.05a2 2 0 1 1 2.83 2.83l-.05.05a1.8 1.8 0 0 0-.36 1.98 1.8 1.8 0 0 0 1.65 1.09h.08a2 2 0 0 1 0 4h-.08A1.8 1.8 0 0 0 19.4 15Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="adaptive-k-menu" id="adaptive-k-menu">
          <div class="settings-section">
            <label class="auto-param-toggle" id="auto-param-toggle-wrap" title="질의 유형에 따라 Top-K와 온도를 자동으로 조절합니다.">
              <input type="checkbox" id="auto-param-toggle" checked>
              <span class="auto-param-toggle-text">검색/답변 자동 설정</span>
            </label>
          </div>
          <div class="settings-section">
            <div class="settings-section-title">OCR 인덱스</div>
            <div class="settings-radio-group">
              <label class="radio-pill">
                <input type="radio" name="ocr-index" value="v2_only" checked>
                <span>보정본 OCR만</span>
              </label>
              <label class="radio-pill">
                <input type="radio" name="ocr-index" value="v1_v2_combined">
                <span>원본+보정본 OCR 통합</span>
              </label>
            </div>
          </div>
          <div class="settings-section doc-scope" id="doc-scope">
            <div class="settings-section-title">문서 범위</div>
            <div class="doc-scope-summary" id="doc-scope-summary">전체</div>
            <div class="doc-scope-menu">
              <label class="scope-check">
                <input type="checkbox" data-doc-scope value="__all__" checked>
                <span>전체 문서</span>
              </label>
              <div id="doc-scope-options">
                <label class="scope-check"><input type="checkbox" data-doc-scope value="심평원"><span>심평원<small>건강보험 행위 급여·비급여 목록표 및 급여 상대가치점수</small></span></label>
                <label class="scope-check"><input type="checkbox" data-doc-scope value="약관"><span>약관<small>신한 이지로운 실손의료보험(무배당) 약관</small></span></label>
                <label class="scope-check"><input type="checkbox" data-doc-scope value="가이드북"><span>가이드북<small>보상가이드북</small></span></label>
                <label class="scope-check"><input type="checkbox" data-doc-scope value="자사_SOL건강"><span>자사_SOL건강<small>신한 SOL 처음건강보험(무배당)(자동갱신형) 약관</small></span></label>
                <label class="scope-check"><input type="checkbox" data-doc-scope value="자사_SOL운전자"><span>자사_SOL운전자<small>신한 SOL 처음운전자보험(무배당) 약관</small></span></label>
                <label class="scope-check"><input type="checkbox" data-doc-scope value="표준약관"><span>표준약관<small>표준약관(제5-13조제1항관련)</small></span></label>
                <label class="scope-check"><input type="checkbox" data-doc-scope value="실무가이드"><span>실무가이드<small>Claim 실무종합가이드</small></span></label>
                <label class="scope-check"><input type="checkbox" data-doc-scope value="상담사례집"><span>상담사례집<small>소비자 상담 주요 사례집</small></span></label>
                <label class="scope-check"><input type="checkbox" data-doc-scope value="비급여 표준모델"><span>비급여 표준모델<small>비급여 표준 모델 전체판</small></span></label>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="s-divider" id="manual-param-divider"></div>
      <div class="s-group manual-param-control">
        <span class="s-label">Top-K</span>
        <div class="range-wrap">
          <input type="range" class="range-input" min="1" max="20" value="10" data-range-format="integer">
          <span class="range-val">10</span>
        </div>
      </div>
      <div class="s-divider manual-param-control"></div>
      <div class="s-group manual-param-control">
        <span class="s-label">온도</span>
        <div class="range-wrap">
          <input type="range" class="range-input" min="0" max="10" value="2" data-range-format="decimal">
          <span class="range-val">0.2</span>
        </div>
      </div>
      <div class="s-divider"></div>
      <div class="model-badge-wrap" id="active-model-badge" aria-live="polite">
        <span class="model-badge-label">활성 모델</span>
        <span class="model-badge-value" id="active-model-label">확인 중...</span>
      </div>
      <label class="reasoning-toggle hidden" id="reasoning-toggle-wrap" title="내부 추론 문장은 화면에 표시하지 않습니다.">
        <input type="checkbox" id="reasoning-mode-toggle">
        <span class="reasoning-toggle-text">추론 모드</span>
        <span class="reasoning-toggle-note">내부 추론 문장은 표시하지 않습니다.</span>
      </label>
      <div class="export-wrap">
        <button class="export-btn" type="button" data-action="toggle-export">
          <svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          내보내기
        </button>
        <div class="export-menu" id="exp-menu">
          <div class="export-item" data-export-format="txt">📄 TXT 파일</div>
          <div class="export-item" data-export-format="csv">📊 CSV 파일</div>
          <div class="export-item" data-export-format="json">🗂 JSON 파일</div>
        </div>
      </div>
    </div>

    <div class="mode-bar">
      <span class="mode-label">검색 모드</span>
      <button class="mode-tab active" type="button" data-mode="general">일반 질의</button>
      <button class="mode-tab" type="button" data-mode="claim">보험금 계산</button>
      <div class="mode-claim-generation">
        <label class="p-label">실손 세대 기준</label>
        <div class="claim-radio-group">
          <label><input type="radio" name="claim-policy-generation" value="4th"/> 4세대 실손</label>
          <label><input type="radio" name="claim-policy-generation" value="5th" checked/> 5세대 실손</label>
        </div>
      </div>
    </div>

    <div class="sub-panel" id="panel-claim">
      <div class="claim-grid">
        <div class="claim-lines" id="claim-lines">
          <div class="claim-line-row" data-claim-line>
            <div class="p-field">
              <label class="p-label">청구 항목명</label>
              <input class="p-input claim-item-name" type="text" placeholder="예: 도수치료"/>
            </div>
            <div class="p-field">
              <label class="p-label">수가/표준 코드 <span style="color:var(--gray);font-weight:400;">(옵션)</span></label>
              <input class="p-input claim-item-code" type="text" placeholder="예: L1213 / MX122"/>
            </div>
            <div class="p-field">
              <label class="p-label">급여 본인부담금</label>
              <input class="p-input claim-insured-copay-amount" type="text" placeholder="예: 0"/>
            </div>
            <div class="p-field">
              <label class="p-label">비급여 금액</label>
              <input class="p-input claim-nonpay-amount" type="text" placeholder="예: 0"/>
            </div>
            <div class="p-field">
              <label class="p-label">횟수/수량</label>
              <input class="p-input claim-quantity" type="text" value="1"/>
            </div>
            <div class="p-field">
              <label class="p-label">항목 분류 힌트</label>
              <select class="p-input claim-category-hint">
                <option value="">모름</option>
                <option value="급여">급여</option>
                <option value="비급여">비급여</option>
                <option value="3대비급여">3대비급여</option>
                <option value="중증비급여">5세대 중증 비급여</option>
                <option value="비중증비급여">5세대 비중증 비급여</option>
              </select>
            </div>
            <div class="p-field claim-extra-info-field">
              <label class="p-label">기타 추가 정보</label>
              <input class="p-input claim-extra-info" type="text" placeholder="예: 입원 중 수술 마취"/>
            </div>
            <button class="btn-sm claim-remove-line" type="button" data-action="remove-claim-line" aria-label="청구 항목 삭제">삭제</button>
          </div>
        </div>
        <div class="claim-context-row">
          <div class="p-field claim-diagnosis-field">
            <label class="p-label">진단코드</label>
            <input class="p-input" id="claim-diagnosis-code" type="text" placeholder="예: M54.5"/>
          </div>
          <div class="p-field claim-coverage-field">
            <label class="p-label">보장 주제</label>
            <input class="p-input" id="claim-coverage-topic" type="text" placeholder="예: 실손, 3대비급여"/>
          </div>
          <div class="p-field claim-visit-field">
            <label class="p-label">방문 구분</label>
            <select class="p-input" id="claim-visit-type">
              <option value="">미지정</option>
              <option value="outpatient">통원</option>
              <option value="hospitalization">입원</option>
            </select>
          </div>
          <div class="p-field claim-note">
            <label class="p-label">상황 메모</label>
            <input class="p-input" id="claim-note" type="text" placeholder="예: 통원 1회, 진료비 영수증 및 세부내역서 기준"/>
          </div>
          <div class="claim-actions">
            <button class="btn-sm claim-add-line" type="button" data-action="add-claim-line">항목 추가</button>
            <button class="btn-sm claim-submit" type="button" data-action="send-claim">계산</button>
          </div>
        </div>
      </div>
    </div>

    <div class="chat-messages" id="chat-msgs"></div>

    <div class="input-area">
      <div class="input-row">
        <textarea class="chat-ta" id="chat-input" placeholder="보상 관련 질문을 입력하세요... (Shift+Enter 줄바꿈)" rows="1"></textarea>
        <button class="send-btn" type="button" data-action="send-message">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22 11 13 2 9l20-7z" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>
