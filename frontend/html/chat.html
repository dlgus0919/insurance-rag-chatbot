          <input type="range" class="range-input" min="0" max="10" value="2" data-range-format="decimal">
          <span class="range-val">0.2</span>
        </div>
      </div>
      <div class="s-divider"></div>
      <div class="model-badge-wrap" id="active-model-badge" aria-live="polite">
        <span class="model-badge-label">활성 모델</span>
        <span class="model-badge-value" id="active-model-label">확인 중...</span>
      </div>
      <div class="model-switcher-wrap" id="model-switcher-wrap">
        <label class="model-switcher-label" for="active-model-select">모델 변경</label>
        <select class="model-switcher-select" id="active-model-select" aria-label="활성 모델 변경"></select>
      </div>
      <label class="reasoning-toggle hidden" id="reasoning-toggle-wrap" title="내부 추론 문장은 화면에 표시하지 않습니다.">
        <input type="checkbox" id="reasoning-mode-toggle">
        <span class="reasoning-toggle-text">추론 모드</span>
        <span class="reasoning-toggle-note">내부 추론 문장은 표시하지 않습니다.</span>
      </label>
      <div class="export-wrap">
        <button class="export-btn" type="button" data-action="toggle-export">
          <svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          내보내기
        </button>
        <div class="export-menu" id="exp-menu">
          <div class="export-item" data-export-format="txt">📄 TXT 파일</div>
          <div class="export-item" data-export-format="csv">📊 CSV 파일</div>
          <div class="export-item" data-export-format="json">🗂 JSON 파일</div>
        </div>
      </div>
    </div>

    <div class="mode-bar">
      <span class="mode-label">검색 모드</span>
      <button class="mode-tab active" type="button" data-mode="general">일반 질의</button>
      <button class="mode-tab" type="button" data-mode="quick">퀵 코드 검색</button>
      <button class="mode-tab" type="button" data-mode="formal">약관 정형 검색</button>
      <button class="mode-tab" type="button" data-mode="claim">보험금 계산</button>
    </div>

    <div class="ocr-index-bar">
      <span class="mode-label">OCR 인덱스</span>
      <label class="radio-pill">
        <input type="radio" name="ocr-index" value="default">
        <span>기본 운영 인덱스</span>
      </label>
      <label class="radio-pill">
        <input type="radio" name="ocr-index" value="v2_only" checked>
        <span>보정본 OCR만</span>
      </label>
      <label class="radio-pill">
        <input type="radio" name="ocr-index" value="v1_v2_combined">
        <span>원본+보정본 OCR 통합</span>
      </label>
    </div>

    <div class="sub-panel" id="panel-quick">
      <div class="panel-row">
        <div class="p-field">
          <label class="p-label">시술/수술명 또는 코드</label>
          <input class="p-input" type="text" placeholder="예: 백내장 / Q15.0 / 수정체유화술"/>
        </div>
        <div style="padding-bottom:2px;">
          <label class="check-item"><input id="quick-include-summary" type="checkbox" checked> 분류.점수.산정지침 요약</label>
          <label class="check-item"><input id="quick-include-coverage" type="checkbox" checked> 실손 약관 기준 보상가능 여부 검색</label>
        </div>
        <button class="btn-sm" type="button" data-action="send-quick">검색</button>
      </div>
    </div>

    <div class="sub-panel" id="panel-formal">
      <div class="scenario-chips">
        <span class="p-label" style="padding-top:3px;flex-shrink:0;">시나리오</span>
        <div class="scenario-chip active">3대비급여</div>
        <div class="scenario-chip" data-toggle-active="true">실손</div>
        <div class="scenario-chip" data-toggle-active="true">암보험</div>
      </div>
      <div class="formal-radios">
        <label class="radio-item"><input type="radio" name="ftype" value="보상가능 여부 판정" checked> 보상가능 여부 판정</label>
        <label class="radio-item"><input type="radio" name="ftype" value="약관 조문 검색"> 약관 조문 검색</label>
        <label class="radio-item"><input type="radio" name="ftype" value="키워드/시술명 검색"> 키워드/시술명 검색</label>
      </div>
      <div class="panel-row">
        <div class="p-field" style="max-width:200px;">
          <label class="p-label">진단코드 또는 시술명</label>
          <input class="p-input" type="text" placeholder="예: N39.3 / 요로감염"/>
        </div>
        <div class="p-field">
          <label class="p-label">보장종목</label>
          <div class="formal-tags">
            <div class="tag-chip">질병급여 <span class="rm" data-action="remove-tag">×</span></div>
            <div class="tag-chip">질병비급여 <span class="rm" data-action="remove-tag">×</span></div>
            <div class="tag-chip">3대비급여 <span class="rm" data-action="remove-tag">×</span></div>
          </div>
        </div>
        <div class="p-field" style="grid-column:1 / -1;">
          <label class="p-label">상황 메모 <span style="color:var(--gray);font-weight:400;">(옵션)</span></label>
          <textarea
            class="p-input"
            id="formal-memo"
            rows="2"
            placeholder="추가 상황이나 참고사항을 자유롭게 입력하세요 (예: 입원 7일 초과, 3세대 실손 가입)"
            style="resize:vertical;min-height:52px;"
          ></textarea>
        </div>
        <button class="btn-sm" type="button" data-action="send-formal">검색</button>
      </div>
    </div>

    <div class="sub-panel" id="panel-claim">
      <div class="claim-grid">
        <div class="p-field claim-generation">
          <label class="p-label">실손 세대 기준</label>
          <div class="claim-radio-group">
            <label><input type="radio" name="claim-policy-generation" value="4th" checked/> 4세대 실손</label>
            <label><input type="radio" name="claim-policy-generation" value="5th"/> 5세대 실손</label>
          </div>
        </div>
        <div class="claim-lines" id="claim-lines">
          <div class="claim-line-row" data-claim-line>
            <div class="p-field">
              <label class="p-label">청구 항목명</label>
              <input class="p-input claim-item-name" type="text" placeholder="예: 도수치료"/>
            </div>
            <div class="p-field">
              <label class="p-label">수가/표준 코드 <span style="color:var(--gray);font-weight:400;">(옵션)</span></label>
              <input class="p-input claim-item-code" type="text" placeholder="예: MX122 / 51040"/>
            </div>
            <div class="p-field">
              <label class="p-label">청구금액</label>
              <input class="p-input claim-amount" type="text" placeholder="예: 150000"/>
            </div>
            <div class="p-field">
              <label class="p-label">횟수/수량</label>
              <input class="p-input claim-quantity" type="text" value="1"/>
            </div>
            <div class="p-field">
              <label class="p-label">항목 분류 힌트</label>
              <select class="p-input claim-category-hint">
                <option value="">모름</option>
                <option value="급여">급여</option>
                <option value="비급여">비급여</option>
                <option value="3대비급여">3대비급여</option>
                <option value="중증비급여">5세대 중증 비급여</option>
                <option value="비중증비급여">5세대 비중증 비급여</option>
              </select>
            </div>
            <button class="btn-sm claim-remove-line" type="button" data-action="remove-claim-line" aria-label="청구 항목 삭제">삭제</button>
          </div>
        </div>
        <button class="btn-sm claim-add-line" type="button" data-action="add-claim-line">항목 추가</button>
        <div class="p-field">
          <label class="p-label">진단코드</label>
          <input class="p-input" id="claim-diagnosis-code" type="text" placeholder="예: M54.5"/>
        </div>
        <div class="p-field">
          <label class="p-label">보장 주제</label>
          <input class="p-input" id="claim-coverage-topic" type="text" placeholder="예: 실손, 3대비급여"/>
        </div>
        <div class="p-field">
          <label class="p-label">방문 구분</label>
          <select class="p-input" id="claim-visit-type">
            <option value="">미지정</option>
            <option value="outpatient">통원</option>
            <option value="hospitalization">입원</option>
          </select>
        </div>
        <div class="p-field claim-note">
          <label class="p-label">상황 메모</label>
          <textarea class="p-input" id="claim-note" rows="2" placeholder="예: 통원 1회, 진료비 영수증 및 세부내역서 기준"></textarea>
        </div>
        <button class="btn-sm" type="button" data-action="send-claim">계산</button>
      </div>
    </div>

    <div class="chat-messages" id="chat-msgs"></div>

    <div class="input-area">
      <div class="doc-scope">
        <span class="scope-label">문서 범위</span>
        <div class="scope-chip active" data-action="toggle-scope" data-scope="전체">전체</div>
        <div class="scope-chip" data-action="toggle-scope" data-scope="실손 약관">실손 약관</div>
        <div class="scope-chip" data-action="toggle-scope" data-scope="3대비급여">3대비급여</div>
        <div class="scope-chip" data-action="toggle-scope" data-scope="급여/비급여">급여/비급여</div>
        <div class="scope-chip" data-action="toggle-scope" data-scope="분류점수산정">분류점수산정</div>
        <div class="scope-chip" data-action="toggle-scope" data-scope="판례/심사례">판례/심사례</div>
      </div>
      <div class="input-row">
        <textarea class="chat-ta" id="chat-input" placeholder="보상 관련 질문을 입력하세요... (Shift+Enter 줄바꿈)" rows="1"></textarea>
        <button class="send-btn" type="button" data-action="send-message">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22 11 13 2 9l20-7z" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>
